name: build-and-smoke

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health && curl -fsS http://localhost:8081/health; then
              echo
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Verify equivalent workload
        run: |
          test "$(curl -fsS 'http://localhost:8080/work?delayMs=10&itemId=1')" = "legacy-ok"
          test "$(curl -fsS 'http://localhost:8081/work?delayMs=10&itemId=1')" = "reactive-ok"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
